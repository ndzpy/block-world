name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Gradle
        run: |
          curl -L https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Extract project
        run: unzip -q ./*.zip -d source

      - name: Build APK
        run: gradle -p source/BlockWorldAndroid --no-daemon :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: BlockWorld-debug-apk
          path: source/BlockWorldAndroid/app/build/outputs/apk/debug/app-debug.apk
